[package]
name = "tauri-plugin-reactive"
version = "0.1.0"
edition = "2021"
authors = ["Joseph R Quinn"]
rust-version = "1.90"
description = "Typed reactive state, streams and frontend-to-Rust sinks across Tauri's Rust <-> JS boundary, with per-source permissions and automatic cleanup"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quinnjr/tauri-plugin-reactive"
documentation = "https://docs.rs/tauri-plugin-reactive"
readme = "README.md"
keywords = ["tauri", "tauri-plugin", "reactive", "ipc", "state"]
categories = ["gui", "asynchronous", "web-programming"]
links = "tauri-plugin-reactive"
include = ["/src", "/permissions", "/build.rs", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[workspace]
members = ["examples/shared/backend", "examples/*/src-tauri"]

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
tokio = { version = "1", features = ["sync"] }
ts-rs = { version = "12", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }

[features]
# Generate TypeScript bindings for the registered sources (requires `#[derive(ts_rs::TS)]` on their types).
typegen = ["dep:ts-rs"]

[package.metadata.docs.rs]
all-features = true

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
schemars = "0.8"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
